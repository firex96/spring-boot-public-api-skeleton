# UnresolvedPlaceholderGuardBootIntegrationTest 전용 프로파일 — 애플리케이션 실행에 쓰지 않는다.
# 어디서도 채워지지 않는 논리 키 참조 하나를 두어, META-INF/spring.factories 로 등록된 UnresolvedPlaceholderGuard 가
# 실제 기동 경로(SpringApplication.run → ApplicationEnvironmentPreparedEvent)에서 기동을 막는지 본다.
# 테스트 소스셋의 고정값이므로 설정값·비밀값 규약의 예외(테스트 고정값)다.
guard:
  probe:
    secret: ${no-such-secret-for-guard-probe}
