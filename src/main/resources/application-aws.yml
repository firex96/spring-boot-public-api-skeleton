# aws 프로필 — 논리 키를 AWS Secrets Manager 의 JSON 비밀 하나에서 읽는다.
#   AWS_SECRET_ID : 비밀 이름 또는 ARN (예: public-api-skeleton/prod)
#   리전·자격증명 : AWS SDK 기본 체인 (AWS_REGION, 인스턴스·태스크 역할 등)
# 비밀 값 예: {"db-reader-username":"…","db-reader-password":"…","db-writer-username":"…","db-writer-password":"…","redis-password":"…"}
# 호스트처럼 비밀이 아닌 값(DB_HOST 등)은 환경변수로 주거나 같은 JSON 에 넣는다.
spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_ID}
  cloud:
    aws:
      secretsmanager:
        enabled: true
