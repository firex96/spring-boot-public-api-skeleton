<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('비밀번호 찾기 - Demo')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="auth-main">
    <div class="auth-container">
        <div class="auth-card">
            <h1>비밀번호 찾기</h1>
            <p class="auth-subtitle">가입한 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>
                <button type="submit" class="btn-primary">비밀번호 재설정 링크 받기</button>
            </form>

            <p class="auth-footer">
                비밀번호가 기억나셨나요? <a th:href="@{/demo/auth/login}">로그인</a>
            </p>
        </div>

        <div th:replace="~{fragments/layout :: result-area}"></div>

        <div class="info-box">
            <h3>API 엔드포인트</h3>
            <code>POST /user/password/reset-request</code>
            <p>요청 본문: <code>{"email": "user@example.com"}</code></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: token-script}"></th:block>
<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;

        try {
            const response = await apiCall('/user/password/reset-request', 'POST', { email: email });
            showResult(response);

            if (response.ok) {
                alert('비밀번호 재설정 링크가 이메일로 발송되었습니다.');
            }
        } catch (error) {
            showError(error.message);
        }
    });
</script>
</body>
</html>
