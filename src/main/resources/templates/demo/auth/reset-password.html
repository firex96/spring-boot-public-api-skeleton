<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('비밀번호 재설정 - Demo')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="auth-main">
    <div class="auth-container">
        <div class="auth-card">
            <h1>비밀번호 재설정</h1>
            <p class="auth-subtitle">새 비밀번호를 입력해주세요.</p>

            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="token">재설정 토큰</label>
                    <input type="text" id="token" name="token" placeholder="이메일로 받은 토큰" required>
                </div>
                <div class="form-group">
                    <label for="password">새 비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="8자 이상" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호 확인" required>
                </div>
                <button type="submit" class="btn-primary">비밀번호 변경</button>
            </form>

            <p class="auth-footer">
                <a th:href="@{/demo/auth/login}">로그인으로 돌아가기</a>
            </p>
        </div>

        <div th:replace="~{fragments/layout :: result-area}"></div>

        <div class="info-box">
            <h3>API 엔드포인트</h3>
            <code>POST /user/password/reset</code>
            <pre>{
  "token": "reset-token-from-email",
  "newPassword": "newPassword123"
}</pre>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/scripts :: token-script}"></th:block>
<script>
    // URL 파라미터에서 토큰 추출
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');
    if (tokenFromUrl) {
        document.getElementById('token').value = tokenFromUrl;
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showError('비밀번호가 일치하지 않습니다.');
            return;
        }

        const formData = {
            token: document.getElementById('token').value,
            newPassword: password
        };

        try {
            const response = await apiCall('/user/password/reset', 'POST', formData);
            showResult(response);

            if (response.ok) {
                alert('비밀번호가 변경되었습니다. 로그인 페이지로 이동합니다.');
                window.location.href = '/demo/auth/login';
            }
        } catch (error) {
            showError(error.message);
        }
    });
</script>
</body>
</html>
