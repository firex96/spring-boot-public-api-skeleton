<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f6f8; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        main { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, .08); width: 100%; max-width: 360px; }
        h1 { font-size: 20px; margin: 0 0 20px; }
        label { display: block; font-size: 14px; margin: 12px 0 4px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccd; border-radius: 6px; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 6px; background: #2b59c3; color: #fff; font-size: 15px; cursor: pointer; }
        .error { color: #c0392b; font-size: 14px; margin: 0 0 8px; }
        .ok { color: #1e7e34; font-size: 14px; margin: 0 0 8px; }
    </style>
</head>
<body>
<main>
    <h1>로그인</h1>
    <!-- 인가 서버 로그인 — 성공하면 기다리던 authorize 요청으로 돌아간다(서버가 세션에 둔 URL) -->
    <p class="error" th:if="${loginError}" th:text="${loginError}"></p>
    <p class="ok" th:if="${param.success}">로그인되었습니다.</p>
    <form method="post" th:action="@{/oauth2/login}">
        <label for="loginId">아이디</label>
        <input id="loginId" name="loginId" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
</main>
</body>
</html>
